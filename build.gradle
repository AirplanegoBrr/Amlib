import java.security.MessageDigest

plugins{
    id 'com.android.application' version '9.3.1' apply false
    id 'com.android.library' version '9.3.1' apply false
}


// Version name shared by Amlib (crash reports, logs) and the apps built from it
ext.amlibVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = "1.1.7"
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${new Date().format('yyyyMMdd')}")
        }else {
            // Used by github actions
            TAG_STRING =  'amethyst-legacy-' + "${new Date().format('yyyyMMdd')}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}


static void hashFileWithDigest(File fileToHash, MessageDigest digest){
    fileToHash.withInputStream { is ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = is.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
}

static void writeVersionFile(File jarFile, File versionFile){
    def sha1 = MessageDigest.getInstance("SHA-1")
    hashFileWithDigest(jarFile, sha1)
    versionFile.write(sha1.digest().collect { String.format("%02x", it) }.join())
}

static void writeVersionFile(File[] jarFileArray, File versionFile){
    def sha1 = MessageDigest.getInstance("SHA-1")
    jarFileArray.each {jarFile ->
        hashFileWithDigest(jarFile, sha1)
    }
    versionFile.write(sha1.digest().collect { String.format("%02x", it) }.join())
}

subprojects {subproject ->
    if (subproject.name.contains("lwjgl")) return
    tasks.withType(Jar).configureEach {jar ->
        System.out.println("Subproject $subproject configuring jar task destination to app_pojavlauncher/src/main/assets/components/$subproject.name/")
        destinationDirectory.set(
                file("../app_pojavlauncher/src/main/assets/components/$subproject.name")
        )
        doLast {
            def versionFile  = new File(project(":app_pojavlauncher").projectDir, "src/main/assets/components/$subproject.name/version")
            def jarFile = archiveFile.get().asFile
            writeVersionFile(jarFile, versionFile)
        }
    }
}